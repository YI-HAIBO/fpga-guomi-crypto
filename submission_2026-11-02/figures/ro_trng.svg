<text x="490" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="Health Monitor">Health Monitor</text>
<text x="490" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">T1-T7 SP 800-90B</text>
<text x="490" y="204" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">AXI-Lite report</text>
</g>
<g><rect x="40" y="150" width="140" height="60" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
<text x="110" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="Frequency Injection">Frequency Injection</text>
<text x="110" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">A_inj, f_inj</text>
<text x="110" y="204" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">→ t_inv_eff</text>
</g>
<line x1="140" y1="70" x2="175" y2="70" stroke="#5F5E5A" stroke-width="0.6" marker-end="url(#a2)"/>
<line x1="280" y1="70" x2="315" y2="70" stroke="#5F5E5A" stroke-width="0.6" marker-end="url(#a2)"/>
<line x1="420" y1="70" x2="455" y2="70" stroke="#5F5E5A" stroke-width="0.6" marker-end="url(#a2)"/>
<line x1="510" y1="100" x2="510" y2="145" stroke="#5F5E5A" stroke-width="0.6" marker-end="url(#a2)"/>
<line x1="110" y1="100" x2="110" y2="145" stroke="#5F5E5A" stroke-width="0.6" marker-end="url(#a2)"/>
<line x1="230" y1="100" x2="230" y2="145" stroke="#5F5E5A" stroke-width="0.6" marker-end="url(#a2)"/>
<line x1="370" y1="100" x2="370" y2="145" stroke="#5F5E5A" stroke-width="0.6" marker-end="url(#a2)"/>
<line x1="280" y1="210" x2="280" y2="250" stroke="#534AB7" stroke-width="1" marker-end="url(#a2)"/>
<text x="280" y="268" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">mask seed → SM4 engine</text>
<defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
</svg>