<svg viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="RO-TRNG Physical Entropy Source Architecture">
<title>RO-TRNG Physical Entropy Source Architecture</title>
<desc>RO-TRNG Physical Entropy Source Architecture</desc>
<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>
<text x="340" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#2A2926">RO-TRNG Physical Entropy Source Architecture</text>
<g><rect x="40" y="40" width="100" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="90" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="RO11">RO11</text>
<text x="90" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">11-stage inverter</text>
<text x="90" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">~10 MHz</text>
</g>
<g><rect x="180" y="40" width="100" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="230" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="RO9">RO9</text>
<text x="230" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">9-stage inverter</text>
<text x="230" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">~12 MHz</text>
</g>
<g><rect x="320" y="40" width="100" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="370" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="RO7">RO7</text>
<text x="370" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">7-stage inverter</text>
<text x="370" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">~15 MHz</text>
</g>
<g><rect x="460" y="40" width="100" height="60" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="510" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="D-FF">D-FF</text>
<text x="510" y="80" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">100 MHz sampling</text>
<text x="510" y="94" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">1-bit jitter</text>
</g>
<g><rect x="200" y="150" width="160" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="280" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="xs64 Mixer">xs64 Mixer</text>
<text x="280" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">xorshift 64-bit</text>
<text x="280" y="204" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">32-bit mask seed</text>
</g>
